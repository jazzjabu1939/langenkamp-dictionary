name: Check Dictionary entries

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-entries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify every entry declares its form
        run: bash scripts/check-entry-kinds.sh
      - name: Verify entries/index.md is healthy
        run: bash scripts/check-index.sh
